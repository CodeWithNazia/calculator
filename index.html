<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="mainbox">
        <form>
            <!-- Display -->
            <aside class="box">
                <!-- Added type="text", name="display", readonly for proper functionality -->
                <input type="text" class="display" name="display" readonly>
            </aside>

            <!-- First Row -->
            <aside class="box1">
                <input class="col" type="button" value="AC" onclick="display.value=''">
                <input class="color" type="button" value="DE" onclick="display.value = display.value.toString().slice(0,-1)">
                <input class="color" type="button" value="." onclick="display.value+='.'">
                <input class="color" type="button" value="/" onclick="display.value+='/'">
            </aside>

            <!-- Second Row -->
            <aside class="box2">
                <input type="button" value="7" onclick="display.value+='7'">
                <input type="button" value="8" onclick="display.value+='8'">
                <input type="button" value="9" onclick="display.value+='9'">
                <input class="color" type="button" value="*" onclick="display.value+='*'">
            </aside>

            <!-- Third Row -->
            <aside class="box3">
                <input type="button" value="4" onclick="display.value+='4'">
                <input type="button" value="5" onclick="display.value+='5'">
                <input type="button" value="6" onclick="display.value+='6'">
                <input class="color" type="button" value="+" onclick="display.value+='+'">
            </aside>

            <!-- Fourth Row -->
            <aside class="box4">
                <input type="button" value="1" onclick="display.value+='1'">
                <input type="button" value="2" onclick="display.value+='2'">
                <input type="button" value="3" onclick="display.value+='3'">
                <input class="color" type="button" value="-" onclick="display.value+='-'">
            </aside>

            <!-- Fifth Row -->
            <aside class="box5">
                <input type="button" value="00" onclick="display.value+='00'">
                <input class="color" type="button" value="%" onclick="display.value+='%'">
                <input type="button" value="=" class="equal" onclick="display.value= eval(display.value)">
            </aside>
        </form>
    </section>
    <script src="script.js"></script>
</body>

</html>
